# Service agenda (Netlify) : synchro temps réel entre l'agenda iCloud de Loïc et le site.
# Le site lui-même reste sur GitHub Pages.
[build]
  base = "agenda"
  publish = "public"
  command = "npm ci"
  # ne reconstruit que si le code agenda change (pas pour les mises à jour de busy.json)
  ignore = "[ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ] && exit 1 || git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
