name: Créneaux occupés (iCloud Herbalife + RDV Coach)
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: busy
jobs:
  busy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recopier RDV Coach dans iCloud (compteurs seulement)
        continue-on-error: true
        env:
          GOOGLE_ICS_URL: ${{ secrets.GOOGLE_ICS_URL }}
        run: python .github/scripts/mirror.py
      - name: Lire les agendas et écrire busy.json
        env:
          ICS_URL: ${{ secrets.ICLOUD_ICS_URL }}
          GOOGLE_ICS_URL: ${{ secrets.GOOGLE_ICS_URL }}
        run: |
          if [ -z "$ICS_URL" ] && [ -z "$GOOGLE_ICS_URL" ]; then echo "Pas de lien de calendrier configuré"; exit 0; fi
          pip install -q icalendar recurring-ical-events
          python .github/scripts/busy.py
      - name: Enregistrer les changements
        run: |
          git add busy.json .github/state
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Créneaux occupés mis à jour"
            git pull --rebase -q origin main || true
            git push
          fi
